<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#232526" />
    <title>Civilian Apps - ER diagrams</title>
    <style>
      :root {
        --color-gray-1000: #141616;
        --color-gray-900: #232526;
        --color-gray-800: #2e3031;
        --color-gray-700: #383a3b;
        --color-gray-600: #393b3c;
        --color-gray-500: #434546;
        --color-gray-300: #6d7174;
        --color-gray-100: #bebfc1;
        --color-gray-50: #d1d2d3;
        --color-white: #ffffff;
        --color-green-400: #1ded83;
        --color-green-300: #4af19c;
        --overlay-5: rgb(255 255 255 / 5%);
        --overlay-10: rgb(255 255 255 / 10%);
        --overlay-20: rgb(255 255 255 / 20%);
        --overlay-60: rgb(255 255 255 / 60%);
        --overlay-70: rgb(255 255 255 / 70%);
        --border-radius-base: 4px;
        --border-radius-md: 6px;
        --border-radius-lg: 8px;
        --spacing-1: 4px;
        --spacing-2: 8px;
        --spacing-3: 12px;
        --spacing-4: 16px;
        --spacing-6: 24px;
        --spacing-8: 32px;
        --main-font:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --code-font:
          ui-monospace, "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        --global-background: var(--color-gray-1000);
        --global-muted-background: var(--color-gray-900);
        --global-foreground: var(--color-white);
        --global-border: var(--color-gray-700);
        --global-mute-text: var(--color-gray-100);
        --primary-accent: var(--color-green-400);
        --primary-hover: var(--color-green-300);
        --pane-background: var(--color-gray-900);
        --pane-muted-background: var(--color-gray-800);
        --pane-border-hover: var(--color-gray-300);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--global-background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--global-foreground);
        font-family: var(--main-font);
        font-size: 14px;
        line-height: 1.5;
        background-color: var(--global-background);
        background-image: radial-gradient(
          circle,
          var(--color-gray-600) 1px,
          transparent 1px
        );
        background-position: -1px -1px;
        background-size: 16px 16px;
      }

      a {
        color: inherit;
      }

      .app-bar {
        display: flex;
        align-items: center;
        height: 52px;
        padding: 0 var(--spacing-4);
        background: var(--pane-background);
        border-bottom: 1px solid var(--global-border);
      }

      .brand {
        display: inline-flex;
        gap: var(--spacing-2);
        align-items: center;
        color: var(--overlay-60);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        color: var(--color-gray-1000);
        background: var(--primary-accent);
        border-radius: 50%;
      }

      .brand-mark svg {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }

      main {
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: clamp(64px, 12vh, 120px) 0 48px;
      }

      .eyebrow {
        margin: 0 0 var(--spacing-2);
        color: var(--primary-accent);
        font-family: var(--code-font);
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1.25;
      }

      .intro {
        max-width: 540px;
        margin: var(--spacing-3) 0 0;
        color: var(--overlay-70);
        font-size: 13px;
      }

      .project-list {
        display: grid;
        gap: var(--spacing-2);
        padding: 0;
        margin: var(--spacing-8) 0 0;
        list-style: none;
      }

      .project-link {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: var(--spacing-3);
        align-items: center;
        min-height: 68px;
        padding: var(--spacing-3) var(--spacing-4);
        text-decoration: none;
        background: var(--global-muted-background);
        border: 1px solid var(--overlay-20);
        border-radius: var(--border-radius-md);
        box-shadow: 0 4px 20px rgb(0 0 0 / 40%);
        transition:
          background-color 100ms ease-out,
          border-color 100ms ease-out;
      }

      .project-link:hover {
        background: var(--pane-muted-background);
        border-color: var(--pane-border-hover);
      }

      .project-link:focus-visible {
        outline: 2px solid var(--primary-accent);
        outline-offset: 3px;
      }

      .project-icon {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        color: var(--overlay-70);
        background: var(--overlay-5);
        border: 1px solid var(--overlay-10);
        border-radius: var(--border-radius-base);
      }

      .project-icon svg {
        width: 18px;
        height: 18px;
        stroke-width: 1.5;
      }

      .project-copy {
        min-width: 0;
      }

      .project-name {
        display: block;
        overflow: hidden;
        font-family: var(--code-font);
        font-size: 14px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-meta {
        display: block;
        margin-top: var(--spacing-1);
        color: var(--overlay-60);
        font-size: 11px;
      }

      .open-label {
        display: inline-flex;
        gap: var(--spacing-2);
        align-items: center;
        color: var(--global-mute-text);
        font-size: 12px;
      }

      .open-label svg {
        width: 14px;
        height: 14px;
        transition: transform 100ms ease-out;
      }

      .project-link:hover .open-label {
        color: var(--global-foreground);
      }

      .project-link:hover .open-label svg {
        transform: translateX(2px);
      }

      footer {
        margin-top: var(--spacing-6);
        color: var(--overlay-60);
        font-size: 11px;
      }

      footer a {
        color: var(--global-mute-text);
        text-underline-offset: 3px;
      }

      footer a:hover {
        color: var(--primary-hover);
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 24px, 720px);
          padding-top: 48px;
        }

        .project-link {
          grid-template-columns: 36px minmax(0, 1fr);
        }

        .open-label {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="/" aria-label="Civilian Apps ER diagrams home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
            <path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
            <path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
          </svg>
        </span>
        <span>Civilian Apps ERD</span>
      </a>
    </header>

    <main>
      <p class="eyebrow">Schema registry</p>
      <h1>ER diagrams</h1>
      <p class="intro">
        Browse the current database structure for Civilian Apps projects.
      </p>

      <ul class="project-list" aria-label="Available ER diagrams">
        <li>
          <a class="project-link" href="/personal-ai-coach/">
            <span class="project-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
                <path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
                <path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
              </svg>
            </span>
            <span class="project-copy">
              <span class="project-name">personal-ai-coach</span>
              <span class="project-meta">Interactive schema diagram</span>
            </span>
            <span class="open-label">
              Open diagram
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </span>
          </a>
        </li>
      </ul>

      <footer>
        Generated from each project's schema with
        <a href="https://liambx.com">Liam ERD</a>.
      </footer>
    </main>
  </body>
</html>
